[package]
name = "stalmarck"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["CryptoPatrick <cryptopatrick@gmail.com>"]

###############################################################################
description = "A crate implementing Stålmarck's method for efficiently proving propositional logic formulas and verifying logical validity."
documentation = "https://docs.rs/stalmarck"
homepage = "https://github.com/cryptopatrick/stalmarck"
repository = "https://github.com/cryptopatrick/stalmarck"
readme = "README.md"
keywords = ["stalmarck", "sat", "logic", "theorem-proving", "propositional"]
categories = ["algorithms", "mathematics"]
license = "AGPL-3.0-only"
autotests = false
# Whitelist of files published to crates.io. Anything not listed here
# (docs/, bend/, _*/ folders, benchmark tooling) is never packaged. The
# test vectors are included so that the packaged tests can run.
include = [
    "/src/**/*",
    "/tests/**/*",
    "/examples/*.rs",
    "/shared/test-vectors/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/COPYING",
    "/CHANGELOG.md",
]

###############################################################################
[lib]
name = "stalmarck"
path = "src/lib.rs"

[[test]]
name = "tests"
path = "tests/test.rs"

[[test]]
name = "formats"
path = "tests/formats.rs"

[[test]]
name = "vectors"
path = "tests/vectors.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "scryer"
path = "tests/scryer.rs"
required-features = ["scryer"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "gen_vectors"
path = "examples/gen_vectors.rs"

[package.metadata.docs.rs]
features = ["scryer"]

###############################################################################
[features]
# Implementation B: Dilemma branches executed in embedded Scryer Prolog.
scryer = ["dep:scryer-prolog"]

[dependencies]
scryer-prolog = { version = "0.10.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"

# scryer-prolog 0.10.0 violates a Rust safety precondition
# (NonNull::new_unchecked on a null pointer) while building a machine. Debug
# builds check it and abort, so disable those checks for that crate here.
# Downstream users of the `scryer` feature need the same override
# (docs/feasibility-report.md §3.3).
[profile.dev.package.scryer-prolog]
debug-assertions = false
opt-level = 2
